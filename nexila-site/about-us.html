.ti.l .nd2{right:-22px}.ti.r .nd2{left:-22px}
.ti.done .nd2{background:#16A34A;border-color:#16A34A;color:#fff}.ti.cur .nd2{background:var(--orange);border-color:#FDBA74;color:#fff;box-shadow:0 0 0 8px rgba(249,115,22,.2)}
.tc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 22px;box-shadow:0 8px 24px rgba(11,27,58,.06)}
.ti.cur .tc{border-color:var(--orange);box-shadow:0 12px 32px rgba(249,115,22,.18)}
.ti.l .tc{text-align:right}.tc h3{font-size:19px;margin-bottom:6px}.tc p{margin:0;color:var(--muted);font-size:15px}
.dt2{margin-left:8px;font-size:13px;color:var(--muted)}
.tj{grid-column:1/-1;text-align:center;position:relative;z-index:2;padding:10px 0}
.tj span{display:inline-block;background:var(--alt);border:1px solid var(--line);color:var(--muted);padding:5px 16px;border-radius:999px;font-size:12px;font-weight:600}
@media(max-width:900px){.sl{grid-template-columns:1fr}.sf{display:none}.prg{grid-template-columns:1fr}.g2[style]{}}
@media(max-width:700px){.g2{grid-template-columns:1fr}.vt2{grid-template-columns:1fr}.vt2:before{left:22px}.ti.l,.ti.r{grid-column:1;padding:0 0 0 62px}.ti.l .nd2,.ti.r .nd2{left:0;right:auto}.ti.l .tc{text-align:left}.tj{text-align:left;padding-left:62px}.tr{grid-template-columns:44px 1fr auto;padding:16px}.tr .md{font-size:30px}}
@media(max-width:900px){.abg[style*="1.25fr"]{grid-template-columns:1fr!important}}

.sl2.s2{background-image:linear-gradient(150deg,#0f766e,#0B1B3A)}
.gx{background:radial-gradient(420px 280px at 100% 0,#2452c9,transparent 70%),var(--navy);color:#fff;border-radius:26px;padding:30px;box-shadow:0 24px 60px rgba(11,27,58,.3)}
.gxd{margin:16px 0 22px;padding-bottom:22px;border-bottom:1px solid #23407F}
.gxd>span{display:block;color:#9FB0D3;font-size:13px;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.gxd div:not(.wk){font:600 20px var(--fh);color:#C4D1EE}.gxd b{font:800 clamp(44px,6vw,60px) var(--fh);color:var(--orange);line-height:1.1}
.wk{display:flex;gap:6px;margin:12px 0 8px}.wk i{flex:1;height:10px;border-radius:6px}.wk i.m{background:var(--orange)}.wk i.f{background:#3b6be0}
.gxd small{color:#9FB0D3;font-size:12px}
.gxg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gxg>div,.gxo{background:rgba(255,255,255,.07);border:1px solid #2C4A8C;border-radius:16px;padding:14px 16px}
.gxg small,.gxo small,.gxc small{display:block;color:#7FB0FF;font:600 11px var(--fb);text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}
.gxg b,.gxo b{display:block;font:600 14px/1.45 var(--fb);color:#fff}
.gi{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;background:rgba(249,115,22,.2);font-size:17px;margin-bottom:8px}
.gxo{display:flex;gap:14px;align-items:center;margin-top:12px}.gxo .gi{margin:0;flex:none}
.gxc{margin:20px 0 22px}.gxc .chipset i{background:rgba(255,255,255,.08);border-color:#2C4A8C;color:#E4ECFF}
.gx .btn{width:100%;text-align:center}
@media(max-width:480px){.gxg{grid-template-columns:1fr}}

.rvl.row{grid-template-columns:repeat(3,1fr)}
.cr{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px solid #EEF2FA}.cr:last-of-type{border-bottom:0}
.gi2{flex:none;width:42px;height:42px;border-radius:12px;background:rgba(37,99,235,.1);display:grid;place-items:center;font-size:20px}
.cr small{display:block;color:#5B6785;font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-bottom:2px}
.cr a{display:block;color:#0B1B3A;font-weight:600;font-size:15px;padding:1px 0}.cr a:hover{color:var(--orange)}
.mapg{display:grid;grid-template-columns:1.6fr 1fr;gap:24px;margin-top:30px;align-items:stretch}
.mapc{position:relative;min-height:400px;border-radius:22px;overflow:hidden;background:linear-gradient(150deg,#dbe7ff,#eef3ff);border:1px solid var(--line)}
.mapc iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.mapph{position:absolute;inset:0;display:grid;place-items:center;font-size:56px;text-align:center;color:#0B1B3A}.mapph span{display:block;font:600 15px var(--fb);margin-top:6px}
@media(max-width:900px){.rvl.row{grid-template-columns:1fr}.mapg{grid-template-columns:1fr}.mapc{min-height:320px}}
